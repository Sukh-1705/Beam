[package]
name = "beam-core"
version = "0.1.0"
edition = "2021"
authors = ["Beam Systems Team"]
description = "Flagship high-performance cross-device transfer engine with BLAKE3 verification and resumable streaming"

[dependencies]
tokio = { version = "1.38", features = ["full"] }
blake3 = "1.5"
sha2 = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
uuid = { version = "1.8", features = ["v4", "serde"] }
thiserror = "1.0"
anyhow = "1.0"
bytes = "1.6"
futures-util = "0.3"
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.31", features = ["bundled"] }
filetime = "0.2"
clap = { version = "4.5", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = "0.3"
hex = "0.4"
qrcode = { version = "0.14", default-features = false }

[dev-dependencies]
tempfile = "3.10"

[[bin]]
name = "beam-cli"
path = "src/bin/beam_cli.rs"

[[bin]]
name = "beam-daemon"
path = "src/bin/beam_daemon.rs"
